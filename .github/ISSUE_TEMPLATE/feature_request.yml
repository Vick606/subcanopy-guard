name: Feature Request
description: Suggest a new detection signal, integration, or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check [ROADMAP.md](https://github.com/Vick606/subcanopy-guard/blob/main/ROADMAP.md)
        — your idea may already be planned. If it isn't, pitch it here.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Subcanopy Guard to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you ruled them out.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Does this fit the project's scope?
      description: |
        Subcanopy Guard is deliberately a fast, dependency-free, heuristic detector.
        Read the "Not planned" section of the roadmap first.
      options:
        - label: This does not require ML models or external API calls
          required: false
        - label: This is not already covered in the roadmap
          required: true
